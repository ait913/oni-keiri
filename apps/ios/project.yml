name: OniKeiri

options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: net.appily
  createIntermediateGroups: true
  developmentLanguage: ja

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator

targets:
  OniKeiri:
    type: application
    platform: iOS
    sources:
      - OniKeiri
    info:
      path: OniKeiri/Info.plist
      properties:
        ONIKEIRI_API_SCHEME: $(ONIKEIRI_API_SCHEME)
        ONIKEIRI_API_HOST: $(ONIKEIRI_API_HOST)
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations:
          - ja
        UIUserInterfaceStyle: Light
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: OniKeiri/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: net.appily.onikeiri
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: 2J3HYGP2K8
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: OniKeiri/OniKeiri.entitlements

  OniKeiriTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OniKeiriTests
    dependencies:
      - target: OniKeiri
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: 1

schemes:
  OniKeiri:
    build:
      targets:
        OniKeiri: all
    run:
      config: Debug
      executable: OniKeiri
    test:
      config: Debug
      targets:
        - OniKeiriTests
